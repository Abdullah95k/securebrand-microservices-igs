name: soak

# igs's soak test (make soak, internal/ig/e2e/soak_test.go) on a GitHub
# runner: the scheduled pipeline over a changing fakeig world with rate
# limits and component restarts, then a full check of the store against
# fakeig's ground truth. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: How long the world changes (IGS_SOAK_DURATION)
        default: 90m
      profiles:
        description: Profiles crawled (IGS_SOAK_PROFILES)
        default: "20"
      restart_every:
        description: A component restart this often; 0 = never (IGS_SOAK_RESTART_EVERY)
        default: 2m

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Infrastructure
        run: |
          make infra-up
          for i in $(seq 1 60); do docker exec igs-redpanda-1 rpk cluster health --exit-when-healthy && break; sleep 2; done
      - name: Soak
        env:
          IGS_SOAK_DURATION: ${{ inputs.duration }}
          IGS_SOAK_PROFILES: ${{ inputs.profiles }}
          IGS_SOAK_RESTART_EVERY: ${{ inputs.restart_every }}
          IGS_SOAK_OUT: ${{ github.workspace }}/soak.md
        run: make soak > soak.log 2>&1
      - name: Report
        if: always()
        run: |
          if [ -f soak.md ]; then cat soak.md; cat soak.md >> "$GITHUB_STEP_SUMMARY"; fi
          grep -v ' INFO ' soak.log | tail -60 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak
          path: |
            soak.md
            soak.log
          if-no-files-found: ignore
