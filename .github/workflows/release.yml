name: release

# Publishes a release from a version tag (v1.2.3):
#   - the image ghcr.io/abdullah95k/igs:1.2.3 (every binary, distroless),
#   - the image ghcr.io/abdullah95k/igs:1.2.3-browser (with Chromium, for
#     image.browserTag),
#   - the chart oci://ghcr.io/abdullah95k/charts/igs, version 1.2.3, whose
#     appVersion (the default image tag) is 1.2.3.
# The go-live runbook (docs/runbooks/igs-go-live.md) installs from these.
# Run it by hand from the Actions tab to rebuild a tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to publish (v1.2.3)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/abdullah95k/igs
      CHARTS: oci://ghcr.io/abdullah95k/charts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Version from the tag
        id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a version tag: $tag"; exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests
        run: |
          go vet ./...
          go test -count=1 ./...
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - name: Image with Chromium
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: browser
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-browser
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: azure/setup-helm@v5
      - name: Chart
        run: |
          v="${{ steps.v.outputs.version }}"
          helm lint deploy/helm/igs
          helm package deploy/helm/igs --version "$v" --app-version "$v" --destination /tmp/charts
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "/tmp/charts/igs-$v.tgz" "$CHARTS"
      - name: Summary
        run: |
          v="${{ steps.v.outputs.version }}"
          {
            echo "### igs $v"
            echo "- image \`$IMAGE:$v\`"
            echo "- image with Chromium \`$IMAGE:$v-browser\`"
            echo "- chart \`$CHARTS/igs --version $v\`"
          } >> "$GITHUB_STEP_SUMMARY"
