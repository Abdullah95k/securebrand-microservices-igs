# igs field inventory (template 06, section 4 format). Every example is synthetic.
# Generated from the same data as igs-field-inventory.md.
service: igs
platform: ig
repository: Abdullah95k/securebrand-microservices-igs
commit: d50f3ee
access:
  method: internal web GraphQL over HTTP plus post-page HTML (one page load per identity for tokens); browser fallback off
  logged_in: false
entities:
- name: profile
  unified: account
  fetched: 'On the account''s first run, then once a day (ig.schedule.profile_refresh: 24h). Discovery''s vet reads also read it, but publish nothing.'
  notes: Account = Instagram profile. The profile query returns about 5 KB.
  fields:
  - name: user_pk
    meaning: The account's numeric Instagram ID
    type: int64
    example: '1000000001'
    present: always
    present_pct: null
    source: profile query (user by username) (pk; id is the same number as text)
    stored_at: profiles.user_pk
    published_at: ig.profile.v1 Profile.user_pk; content.account.v1 Envelope.native_id (text)
    history: key
    personal_data: true
    notes: 'Stable over renames. igs never keys on the username. Content key: instagram:<pk>.'
  - name: username
    meaning: The handle in the profile URL
    type: text
    example: fake_user_1
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: profiles.username; profile_snapshots.username
    published_at: Profile.username; Account.handle
    history: snapshots
    personal_data: true
    notes: 'Can change. A rename shows as the same user_pk with a new name: a new snapshot row and a new event version. Registration by name (u:<name>) resolves to the pk on the first read.'
  - name: full_name
    meaning: Display name
    type: text
    example: Example Name
    present: often
    present_pct: null
    source: profile query (user by username)
    stored_at: profiles.full_name; profile_snapshots.full_name
    published_at: Profile.full_name; Account.name
    history: snapshots
    personal_data: true
    notes: Empty when the account sets none. UTF-8 as received (Arabic, Kurdish, emoji).
  - name: biography
    meaning: The bio
    type: text
    example: example bio text
    present: often
    present_pct: null
    source: profile query (user by username)
    stored_at: profiles.biography
    published_at: Profile.biography; Account.bio
    history: latest
    personal_data: true
    notes: Postgres keeps the latest only (no bio history table). Each change is a new event version, and the raw response is kept. Instagram's limit is 150 characters. Can hold phone numbers and e-mails.
  - name: bio_links[].url
    meaning: Every link on the profile (website and link-in-bio)
    type: list of text
    example: https://example.com/fake
    present: sometimes
    present_pct: null
    source: profile query (user by username) (bio_links[].url; lynx_url when url is empty)
    stored_at: profiles.bio_links (JSON)
    published_at: Profile.bio_links[].url; Account.links[].url; Account.website = the first link
    history: latest
    personal_data: false
    notes: 'All links Instagram shows (up to 5). lynx_url is Instagram''s redirect wrapper around the same target. No history table: the latest set, plus each change as a new event version.'
  - name: bio_links[].title
    meaning: The link's label
    type: text
    example: Example shop
    present: sometimes
    present_pct: null
    source: profile query (user by username)
    stored_at: profiles.bio_links (JSON)
    published_at: Profile.bio_links[].title; Account.links[].title
    history: latest
    personal_data: false
    notes: ''
  - name: bio_links[] other keys
    meaning: link_id, link_type, is_pinned, creation_source, image_url, media_type, media_accent_color_hex
    type: mixed
    example: '-'
    present: sometimes
    present_pct: null
    source: profile query (user by username)
    stored_at: not stored (raw response only)
    published_at: not published
    history: '-'
    personal_data: false
    notes: 'Dropped: display data, not needed for linking.'
  - name: is_verified
    meaning: Blue tick
    type: bool
    example: 'false'
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: profiles.verified; profile_snapshots.verified
    published_at: Profile.is_verified; Account.verified
    history: snapshots
    personal_data: false
    notes: ''
  - name: is_private
    meaning: Private account
    type: bool
    example: 'false'
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: profiles.private; profile_snapshots.private; profiles.status = private
    published_at: Profile.is_private; Profile.status; Account.is_private
    history: snapshots
    personal_data: false
    notes: A private account gives its profile fields only; igs reads no posts from it.
  - name: follower_count
    meaning: Followers
    type: int64 (optional)
    example: '12345'
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: profiles.follower_count; profile_snapshots.follower_count
    published_at: Profile.follower_count; Account.followers; content.metrics.v1 Metrics.followers (target account)
    history: snapshots
    personal_data: false
    notes: Exact integer, not "12.3K". Absent means unknown, never 0.
  - name: following_count
    meaning: Accounts followed
    type: int64 (optional)
    example: '321'
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: profiles.following_count; profile_snapshots.following_count
    published_at: Profile.following_count; Account.following; Metrics.following
    history: snapshots
    personal_data: false
    notes: Exact.
  - name: media_count
    meaning: Number of posts
    type: int64 (optional)
    example: '456'
    present: always
    present_pct: null
    source: profile query (user by username) (media_count or all_media_count)
    stored_at: profiles.media_count; profile_snapshots.media_count
    published_at: Profile.media_count; Account.post_count; Metrics.post_count
    history: snapshots
    personal_data: false
    notes: Exact.
  - name: profile_pic
    meaning: Profile picture URL (HD first)
    type: text (URL)
    example: https://cdn.example.invalid/fake_pic.jpg?oe=6A1B2C3D
    present: always
    present_pct: null
    source: profile query (user by username) (profile_pic_url_hd, else profile_pic_url)
    stored_at: profiles.profile_pic_url
    published_at: Profile.profile_pic.url; Account.picture_url; ig.media.v1 kind profile_pic
    history: latest
    personal_data: true
    notes: 'Signed CDN URL: expires (the oe parameter, hex Unix time; a few days). Width and height are not served. Not downloaded today.'
  - name: linked_facebook_page
    meaning: Name of the Facebook page linked to the account
    type: text
    example: Example Page
    present: rare
    present_pct: null
    source: profile query (user by username) (linked_fb_info.linked_fb_page.name)
    stored_at: profiles.linked_facebook_page
    published_at: Profile.linked_facebook_page; in content.account.v1 as the title of a Link with platform fb (the name was in url until REQ-008 fix 9)
    history: latest
    personal_data: false
    notes: Share not measured. Its ID is kept since REQ-008 fix 9 (the next row).
  - name: linked_fb_info.linked_fb_page.id
    meaning: The linked Facebook page's ID
    type: text
    example: '100000000000001'
    present: rare
    present_pct: null
    source: profile query (user by username)
    stored_at: profiles.linked_facebook_page_id
    published_at: Profile.linked_facebook_page_id; in content.account.v1 as a Link with platform fb, platform_id the ID and url https://www.facebook.com/<id>
    history: latest
    personal_data: false
    notes: 'Kept since REQ-008 fix 9 (dropped before). The strongest Instagram-to-Facebook link for the entity layer. A linked personal account''s ID is not kept: it is not a page.'
  - name: linked_fb_info.linked_fb_user
    meaning: A linked Facebook user
    type: object
    example: '-'
    present: unknown
    present_pct: null
    source: profile query (user by username)
    stored_at: not stored
    published_at: not published
    history: '-'
    personal_data: true
    notes: Empty in every captured answer. Dropped.
  - name: category
    meaning: Account category
    type: text
    example: Example category
    present: unknown
    present_pct: null
    source: profile query (user by username) (category_name or category, if served)
    stored_at: profiles.category
    published_at: Profile.category; Account.category
    history: latest
    personal_data: false
    notes: Absent from every logged-out answer captured; may be logged-in only. Always empty in practice.
  - name: is_business
    meaning: Business or creator account
    type: bool
    example: 'false'
    present: unknown
    present_pct: null
    source: profile query (user by username) (is_business_account, if served)
    stored_at: profiles.is_business
    published_at: Profile.is_business; Account.is_business
    history: latest
    personal_data: false
    notes: 'Absent from every logged-out answer captured, so always false; false here means unknown (a proto3 bool can''t say so). Fix planned: make it optional.'
  - name: business contact fields
    meaning: Public e-mail, phone, address, city, external_url
    type: text
    example: '-'
    present: unknown
    present_pct: null
    source: profile query (user by username)
    stored_at: not stored
    published_at: not published
    history: '-'
    personal_data: true
    notes: Not in the logged-out answer igs reads. The website appears as a bio link instead of external_url. Whether another logged-out page serves them is unknown.
  - name: pronouns
    meaning: Pronouns, joined with "/"
    type: text
    example: they/them
    present: rare
    present_pct: null
    source: profile query (user by username)
    stored_at: not stored
    published_at: Profile.pronouns; Account.extras_json.pronouns
    history: latest
    personal_data: true
    notes: Published but not stored in Postgres (no column).
  - name: highlight_count
    meaning: Number of highlights
    type: int32
    example: '3'
    present: always
    present_pct: null
    source: highlights list inside the profile query (counted)
    stored_at: profiles.highlight_count
    published_at: Profile.highlight_count; Account.extras_json.highlight_count
    history: latest
    personal_data: false
    notes: ''
  - name: highlights_hash
    meaning: Hash of the highlights list
    type: bytes
    example: '-'
    present: always
    present_pct: null
    source: derived by igs
    stored_at: profiles.highlights_hash
    published_at: Profile.highlights_hash
    history: latest
    personal_data: false
    notes: 'Internal: unchanged highlights aren''t re-read.'
  - name: has_any_clips
    meaning: The account has reels
    type: bool
    example: 'true'
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: not stored
    published_at: not published
    history: '-'
    personal_data: false
    notes: Parsed, unused.
  - name: is_memorialized
    meaning: Memorial account
    type: bool
    example: 'false'
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: not stored (profiles.memorialized exists but is never written)
    published_at: not published
    history: '-'
    personal_data: false
    notes: Dropped. Could feed status.
  - name: other profile keys
    meaning: is_unpublished, is_coppa_enforced, account_badges, show_text_post_app_badge, text_post_app_badge_label
    type: mixed
    example: '-'
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: not stored
    published_at: not published
    history: '-'
    personal_data: false
    notes: Dropped. text_post_app_badge_label hints that a Threads account exists (a possible cross-platform signal).
  - name: latest_reel_media
    meaning: Time of the newest story
    type: int64 (Unix s)
    example: '1767254400'
    present: sometimes
    present_pct: null
    source: profile query (user by username)
    stored_at: not stored
    published_at: not published
    history: '-'
    personal_data: false
    notes: Dropped. Stories aren't collected (see Story or highlight).
  - name: status
    meaning: active, private, unavailable, suppressed
    type: enum
    example: active
    present: always
    present_pct: null
    source: 'derived by igs (no user: unavailable; erasure: suppressed)'
    stored_at: profiles.status
    published_at: Profile.status; Account.is_deleted (unavailable or suppressed); Account.is_private
    history: latest
    personal_data: false
    notes: '"Unavailable" covers renamed, deleted and wrong names: Instagram answers the same "no user" for all three.'
  - name: requested_ref
    meaning: What the client registered
    type: text
    example: u:fake_user_1
    present: always
    present_pct: null
    source: API registration
    stored_at: profile_schedule.profile_ref; profile_registrations
    published_at: Profile.requested_ref; Account.extras_json.requested_ref
    history: key
    personal_data: true
    notes: u:<name> or id:<pk>.
  - name: author_key
    meaning: HMAC of the user pk
    type: bytes (32)
    example: '-'
    present: always
    present_pct: null
    source: derived by igs (privacy.author_hmac_key)
    stored_at: profiles.author_key
    published_at: Profile.author_key (not on content.account.v1)
    history: key
    personal_data: false
    notes: A pseudonym, the same as the account's author_key when it comments.
  - name: url
    meaning: Profile URL
    type: text
    example: https://www.instagram.com/fake_user_1/
    present: always
    present_pct: null
    source: derived by igs (from username)
    stored_at: not stored
    published_at: Account.extras_json.url (content.account.v1 has no url field)
    history: latest
    personal_data: false
    notes: ''
  - name: kind
    meaning: Account kind
    type: text
    example: profile
    present: always
    present_pct: null
    source: derived by igs
    stored_at: not stored
    published_at: Account.kind (always profile)
    history: latest
    personal_data: false
    notes: ''
  - name: bookkeeping
    meaning: content_hash, first_seen_at, last_scraped_at, last_profile_read_at
    type: bytes, timestamps
    example: '-'
    present: always
    present_pct: null
    source: derived by igs
    stored_at: profiles.*
    published_at: Observation.content_hash and observed_at
    history: latest
    personal_data: false
    notes: ''
- name: profile_snapshot
  unified: account_snapshot
  fetched: Every profile read (daily). Stored only when a value changed since the last row; published on every read.
  notes: 'There is no content.account_snapshot.v1 topic: account counts go to content.metrics.v1 with target = account.'
  fields:
  - name: user_pk
    meaning: The account
    type: int64
    example: '1000000001'
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: profile_snapshots.user_pk
    published_at: content.metrics.v1 Envelope.native_id (target account)
    history: key
    personal_data: false
    notes: ''
  - name: captured_at
    meaning: When igs read it
    type: timestamp (UTC)
    example: '2026-11-05T09:00:00Z'
    present: always
    present_pct: null
    source: derived by igs
    stored_at: profile_snapshots.captured_at
    published_at: Envelope.observed_at
    history: key
    personal_data: false
    notes: Monthly partitions.
  - name: follower_count, following_count, media_count
    meaning: Counts
    type: int64 (optional)
    example: '12345'
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: profile_snapshots.*
    published_at: Metrics.followers, following, post_count
    history: snapshots
    personal_data: false
    notes: Exact.
  - name: username, full_name, verified, private
    meaning: Identity flags at that time
    type: text, bool
    example: fake_user_1
    present: always
    present_pct: null
    source: profile query (user by username)
    stored_at: profile_snapshots.*
    published_at: on content.account.v1 (a new version)
    history: snapshots
    personal_data: true
    notes: Bio and links are not in the snapshot table.
- name: post
  unified: post
  fetched: 'The grid on every visit (hot 10 min, warm 1 h, long tail 3 h) back to the newest stored post; each new post''s page once; posts of the last 7 days re-read with doubling gaps (interval * 2^n, at most 30 a run), which is about 5 re-reads per post on the 3-hour tier. Backfill on registration: 365 days (limits.max_age_days).'
  notes: Post = feed post, video, carousel or reel (reel = product type clips). The post page is about 118 KB.
  fields:
  - name: media_pk
    meaning: The post's numeric ID
    type: int64
    example: '3000000000000000001'
    present: always
    present_pct: null
    source: grid query (profile timeline) (pk/id)
    stored_at: posts.media_pk; post_index
    published_at: ig.post.v1 Post.media_pk; content.post.v1 Envelope.native_id (text)
    history: key
    personal_data: false
    notes: 'Stable. The posting time can be derived from it. One object, two IDs: media_pk and shortcode (convertible).'
  - name: shortcode
    meaning: The post's code in its URL
    type: text
    example: FAKEcode01
    present: always
    present_pct: null
    source: grid query (profile timeline) (code)
    stored_at: posts.shortcode; post_index.shortcode
    published_at: Post.shortcode; content.post.v1 extras.shortcode
    history: key
    personal_data: false
    notes: ''
  - name: owner_pk
    meaning: The account that posted it
    type: int64
    example: '1000000001'
    present: always
    present_pct: null
    source: grid query (profile timeline)
    stored_at: posts.owner_pk; post_owners (role owner)
    published_at: Post.owner_pk; content.post.v1 Post.account_id
    history: key
    personal_data: true
    notes: ''
  - name: taken_at
    meaning: Posting time
    type: timestamp (UTC)
    example: '2026-11-01T18:30:00Z'
    present: always
    present_pct: null
    source: grid query (profile timeline) (taken_at, Unix seconds)
    stored_at: posts.taken_at (monthly partitions)
    published_at: Post.taken_at; Envelope.published_at
    history: key
    personal_data: false
    notes: Exact to the second.
  - name: media_type
    meaning: photo (1), video (2), carousel (8)
    type: enum
    example: '1'
    present: always
    present_pct: null
    source: grid query (profile timeline); post page (HTML with embedded JSON)
    stored_at: posts.media_type
    published_at: Post.media_type
    history: latest
    personal_data: false
    notes: 'In one run of 69,094 posts: 57% photos, 40% videos, 2.5% carousels.'
  - name: product_type
    meaning: feed, clips (reel), carousel_container, igtv
    type: text
    example: clips
    present: always
    present_pct: null
    source: grid query (profile timeline); post page (HTML with embedded JSON)
    stored_at: posts.product_type
    published_at: Post.product_type; extras.product_type
    history: latest
    personal_data: false
    notes: ''
  - name: kind
    meaning: post, video, reel or highlight
    type: enum
    example: reel
    present: always
    present_pct: null
    source: derived by igs (from product and media type)
    stored_at: posts.kind
    published_at: content.post.v1 Post.kind
    history: latest
    personal_data: false
    notes: Highlight items are posts of kind highlight (owner's choice).
  - name: caption
    meaning: The post's text
    type: text
    example: 'example caption #fakeTag @fake_user_2'
    present: often
    present_pct: null
    source: post page (HTML with embedded JSON) (caption.text)
    stored_at: posts.caption; post_edits.caption (each replaced caption, with when the new one was seen)
    published_at: Post.caption; content.post.v1 Post.text
    history: versions
    personal_data: true
    notes: Full text, never truncated by igs; line breaks and emoji kept. Instagram's limit is 2,200 characters. No language field is served.
  - name: caption_edited
    meaning: Instagram's edited flag
    type: bool
    example: 'false'
    present: sometimes
    present_pct: 8
    source: post page (HTML with embedded JSON) (caption_is_edited)
    stored_at: posts.caption_edited
    published_at: Post.caption_edited; extras.caption_edited
    history: latest
    personal_data: false
    notes: True on 8% of 3,521 post pages (measured 1 Nov). No edit time is served.
  - name: hashtags
    meaning: Hashtags in the caption
    type: list of text
    example: '["fakeTag"]'
    present: sometimes
    present_pct: null
    source: derived by igs (regular expression over the caption)
    stored_at: posts.hashtags
    published_at: Post.hashtags; extras.hashtags
    history: versions
    personal_data: false
    notes: No positions kept. Instagram serves no hashtag entities logged out.
  - name: mentions
    meaning: Usernames mentioned in the caption
    type: list of text
    example: '["fake_user_2"]'
    present: sometimes
    present_pct: null
    source: derived by igs (regular expression over the caption)
    stored_at: posts.mentions
    published_at: Post.mentions; extras.mentions
    history: versions
    personal_data: true
    notes: Usernames, not IDs; no positions.
  - name: accessibility_caption
    meaning: Instagram's automatic image description
    type: text
    example: Photo of example scene
    present: often
    present_pct: null
    source: grid query (profile timeline); post page (HTML with embedded JSON)
    stored_at: posts.accessibility_caption
    published_at: Post.accessibility_caption; extras.accessibility_caption; Media.alt_text on carousel children
    history: latest
    personal_data: false
    notes: Share not measured.
  - name: location
    meaning: 'Tagged place: pk, name, lat, lng'
    type: object
    example: '{pk: 200000001, name: "Example Place", lat: 33.3, lng: 44.4}'
    present: sometimes
    present_pct: 10
    source: post page (HTML with embedded JSON) (location)
    stored_at: posts.location (JSON)
    published_at: Post.location; extras.location
    history: latest
    personal_data: false
    notes: 10% of post pages. Coordinates when given.
  - name: usertags
    meaning: 'Accounts tagged in the media: user_pk, username, x, y, child'
    type: list of object
    example: '[{user_pk: 1000000002, username: fake_user_2, x: 0.5, y: 0.4}]'
    present: sometimes
    present_pct: 10
    source: post page (HTML with embedded JSON) (usertags, and carousel children's)
    stored_at: posts.usertags (JSON)
    published_at: Post.usertags; extras.tagged_ids (IDs only)
    history: latest
    personal_data: true
    notes: 10% of post pages. x and y from 0 to 1.
  - name: coauthors
    meaning: 'Collaborators: user_pk, username'
    type: list of object
    example: '[{user_pk: 1000000003, username: fake_user_3}]'
    present: rare
    present_pct: 6
    source: post page (HTML with embedded JSON) (coauthor_producers)
    stored_at: posts.coauthors (JSON); post_owners (role coauthor)
    published_at: Post.coauthors; content.post.v1 Post.coauthor_ids
    history: latest
    personal_data: true
    notes: 6% of post pages. A collaboration also shows in each co-author's reels tab.
  - name: music
    meaning: title, artist, audio_id, original_audio
    type: object
    example: '{title: "Example Song", artist: "Example Artist", audio_id: "900000001", original_audio: false}'
    present: often
    present_pct: 50
    source: 'post page (HTML with embedded JSON) (clips_metadata: music_info or original sound)'
    stored_at: posts.music (JSON)
    published_at: Post.music; extras.music
    history: latest
    personal_data: false
    notes: '50% of post pages: 200 licensed tracks in the sample, the rest original audio. is_explicit, audio_filter_infos and similar keys dropped.'
  - name: topics
    meaning: Instagram's related topics
    type: list of text
    example: '["Example topic"]'
    present: often
    present_pct: 89
    source: post page (HTML with embedded JSON) (related_topic_pills[].topic_name)
    stored_at: posts.topics
    published_at: Post.topics; extras.topics
    history: latest
    personal_data: false
    notes: 89% of post pages. topic_id dropped.
  - name: ai_label
    meaning: AI-generated label text
    type: text
    example: AI info
    present: rare
    present_pct: 7
    source: post page (HTML with embedded JSON) (ai_label_info)
    stored_at: posts.ai_label
    published_at: Post.ai_label; extras.ai_label
    history: latest
    personal_data: false
    notes: 7% of post pages.
  - name: like_count
    meaning: Likes
    type: int64 (optional)
    example: '68'
    present: often
    present_pct: 97
    source: post page (HTML with embedded JSON) (like_count); reels-tab query for reels
    stored_at: posts.like_count (NULL when hidden); post_metrics.like_count (reels)
