# igs's topics (ADR 0005 §3), applied like configs/topics.yaml. Names get
# kafka.topic_prefix prepended. Sized for 10,000 profiles (REQ-008 fix 20),
# as the platform creates them on the production Kafka (its kafka.tf,
# 7 Nov 2026): 99 partitions. Each count is at least the most pods that
# consume the topic (the chart's KEDA maxima; TestKEDAMaximaFitTopics).
# Partitions can only grow; to grow one in production, the platform changes
# kafka.tf. Local dev can cap them (--partitions-cap 3).
replicas: 3
topics:
  # Internal work queues (securebrand.igs.task.v1.Task envelopes). Crawl
  # tasks keep 24 h, like fbs's: a job is reaped after 30 minutes without
  # progress, so a day covers any redelivery.
  - {name: igs.task.profile.p0, partitions: 3,  retention: 24h}
  - {name: igs.task.profile.p1, partitions: 6,  retention: 24h}
  - {name: igs.task.profile.p2, partitions: 3,  retention: 24h}
  - {name: igs.task.post.p0,    partitions: 6,  retention: 24h}
  - {name: igs.task.post.p1,    partitions: 12, retention: 24h}
  - {name: igs.task.post.p2,    partitions: 6,  retention: 24h}
  - {name: igs.task.media,      partitions: 3,  retention: 72h}
  - {name: igs.task.retry.30s,  partitions: 3,  retention: 48h}
  - {name: igs.task.retry.5m,   partitions: 3,  retention: 48h}
  - {name: igs.task.dlq,        partitions: 3,  retention: 336h}
  - {name: igs.persist.dlq,     partitions: 3,  retention: 336h}
  # Public contract (securebrand.ig.v1 and securebrand.common.v1). PII
  # topics use delete retention, never compaction, so erased data ages out.
  - {name: ig.profile.v1,         partitions: 3,  retention: 168h}
  - {name: ig.post.v1,            partitions: 6,  retention: 168h}
  - {name: ig.post_metrics.v1,    partitions: 6,  retention: 168h}
  - {name: ig.comment.v1,         partitions: 12, retention: 168h}
  - {name: ig.media.v1,           partitions: 3,  retention: 168h}
  - {name: ig.highlight.v1,       partitions: 3,  retention: 168h}
  - {name: ig.job.v1,             partitions: 3,  retention: 168h}
  - {name: ig.erasure.v1,         partitions: 3,  retention: 720h}
  # The shared content contract (securebrand-contracts v1.2.0), from
  # igs-normalizer. The platform owns these topics: igsctl kafka apply
  # leaves every content.* topic out unless --include-content asks for it
  # (a Kafka of igs's own). The media hand-off (content.media.ready,
  # processed and deleted) replaced igs's ig.media.ready, processed and
  # deleted topics; igs deletes no topic, so those stay where they exist.
  - {name: content.post.v1,             partitions: 48, retention: 168h}
  - {name: content.comment.v1,          partitions: 96, retention: 168h}
  - {name: content.account.v1,          partitions: 24, retention: 168h}
  - {name: content.account_snapshot.v1, partitions: 24, retention: 168h}
  - {name: content.metrics.v1,          partitions: 96, retention: 168h}
  - {name: content.media.v1,            partitions: 24, retention: 168h}
  - {name: content.media.ready.v1,      partitions: 3,  retention: 168h}
  - {name: content.media.processed.v1,  partitions: 3,  retention: 168h}
  - {name: content.media.deleted.v1,    partitions: 3,  retention: 168h}
  - {name: content.playlist.v1,         partitions: 6,  retention: 168h}
  - {name: content.audio.v1,            partitions: 6,  retention: 168h}
  - {name: collection.coverage.v1,      partitions: 3,  retention: 168h}
