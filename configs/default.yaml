# Default configuration for every fbs binary. Values can be overridden by a
# file passed with --config and by environment variables:
#   IGS_<SECTION>__<KEY>=value   e.g. IGS_POSTGRES__DSN, IGS_CRAWLER__STAGES
service:
  name: fbs
  env: dev

log:
  level: info        # debug | info | warn | error
  format: json       # json | text

http:
  addr: ":8080"            # API listener (fbs-api)
  ops_addr: ":9090"        # /metrics, /healthz, /readyz on every binary
  read_timeout: 15s
  write_timeout: 60s

postgres:
  dsn: "postgres://fbs:fbs@localhost:5432/fbs?sslmode=disable"
  read_dsn: ""             # optional read replica for API reads
  max_conns: 20

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  tls: {enabled: false}   # see kafka.tls

kafka:
  brokers: ["localhost:19092"]
  client_id: fbs
  topic_prefix: ""        # prepended to every topic name (useful for shared clusters)
  produce_linger: 5ms
  compression: zstd
  # TLS to the brokers: the system roots, plus ca_file when set; cert_file
  # and key_file for mutual TLS; server_name to override the verified name.
  tls:
    enabled: false
    ca_file: ""
    cert_file: ""
    key_file: ""
    server_name: ""
  # SASL: plain, scram-sha-256 or scram-sha-512 ("" = none). Put the
  # password in IGS_KAFKA__SASL__PASSWORD, not here.
  sasl:
    mechanism: ""
    username: ""
    password: ""
  # Schema Registry for the public fb.v1 contract (`fbctl schemas apply`).
  # Records stay plain protobuf with the type in the igs-type header; the
  # registry documents the schemas and rejects incompatible changes.
  schema_registry:
    url: ""                # e.g. http://localhost:18081 (Redpanda dev)
    username: ""
    password: ""

s3:
  endpoint: "localhost:9000"
  access_key: "fbs"
  secret_key: "fbs-secret"
  use_ssl: false
  region: "us-east-1"
  media_bucket: "igs-media"
  raw_bucket: "igs-raw"

fb:
  # Base URL of the Facebook web surface. Tests and local dev point this at fakefb.
  base_url: "https://www.facebook.com"
  # Logical query registry; seeded into Postgres by `fbctl migrate`.
  registry_seed: "queries.seed.yaml"
  registry_refresh: 30s
  fingerprint_profile: chrome_146
  # Profiles new identities pick from at random (each keeps its own); empty
  # means fingerprint_profile alone. Every name must be in fingerprints.yaml.
  fingerprint_profiles: [chrome_152, chrome_146]
  locale: en_US
  accept_language: "en-US,en;q=0.9"
  request_timeout: 30s
  # Cap applied to every identity (requests per second) and burst.
  identity_rps: 0.33
  identity_burst: 2
  identity_max_requests_min: 150
  identity_max_requests_max: 400
  # Per page, fleet wide (Redis GCRA).
  page_rps: 3
  page_rps_p0: 6
  # Global ceiling across the fleet, and AIMD's starting point.
  global_rps: 50
  # AIMD: every 10s the leader scheduler looks at the fleet's block rate
  # (rate limits, login walls, checkpoints) over the last window. Above
  # high_block_rate the ceiling is multiplied by `decrease`; below
  # low_block_rate, while the fleet uses at least min_utilization of the
  # ceiling, it grows by `increase`. Crawlers re-read it every 5s.
  # Headless-Chromium fallback. When a page's HTML carries no tokens (it
  # needs JavaScript first), the identity is bootstrapped in a browser
  # through its own proxy, for at most max_share of HTML loads and
  # max_concurrent browsers per process. fbs-registry-sync also renders a
  # canary page to read doc_ids from the requests the page makes when the
  # bundles do not declare a query. Needs a Chromium in the image.
  browser:
    enabled: false
    binary: ""
    max_concurrent: 2
    max_share: 0.02
    timeout: 45s
    no_sandbox: false
  aimd:
    enabled: true
    interval: 10s
    min_rps: 5
    max_rps: 500
    increase: 0.02
    decrease: 0.7
    low_block_rate: 0.02
    high_block_rate: 0.06
    min_samples: 100
    min_utilization: 0.8
  # Extra classification rules, appended to the built-in ones (replace:
  # true puts each list given in place of the built-in one): error codes,
  # stale-query messages (regular expressions), wall paths and markers.
  detect:
    replace: false
    rate_limit_codes: []
    soft_codes: []
    login_codes: []
    stale_messages: []
    login_markers: []
    block_markers: []
    checkpoint_markers: []
    checkpoint_paths: []
    login_paths: []
    checkpoint_page_markers: []
    login_page_markers: []
  capture_raw: failures    # all | failures | none
  # Share of responses a candidate parser (internal/crawl/shadow) also
  # parses, to prove a new parser version on live traffic before it becomes
  # active. Nothing runs unless a candidate is compiled in.
  shadow_rate: 0.05
  proxy:
    tiers: []
    # - name: isp
    #   kind: static_list
    #   endpoints: ["http://user:pass@1.2.3.4:8000"]
    # - name: residential
    #   kind: gateway
    #   gateway: "http://gw.provider.example:7777"
    #   username: "user"
    #   password: "pass"
    #   username_template: "{user}-country-{country}-session-{session}-sesstime-{ttl_min}"
    #   sticky_ttl: 10m
    #   country: us
    routing:
      default: [direct]
    # Circuit breaker per exit bucket (a static endpoint's /24, or a gateway
    # and country): one blocked or failing too often gets no new identities
    # until its cooldown ends, then a single probe identity.
    breaker:
      window: 1m
      min_events: 20
      open_rate: 0.15
      cooldown: 2m
      max_cooldown: 30m
      probe_successes: 3
  # Circuit breaker per (query, doc_id): when responses keep failing to parse
  # (schema drift) or the doc_id is rejected, stop sending that query (tasks
  # retry later) instead of spending requests until a registry or parser
  # update lands.
  query_breaker:
    window: 5m
    min_events: 20
    open_rate: 0.5
    cooldown: 2m
    max_cooldown: 30m
    probe_successes: 3

crawler:
  stages: [page, post, thread]
  # In-flight tasks per pod and stage, shared by the lanes in priority order:
  # p0 on-demand > p1 scheduled > p2 backfill. Idle capacity of one lane is
  # used by the others and handed back as their tasks finish (tasks yield
  # within yield_after). Set slots to 0 to give each lane fixed slots.
  slots: 240
  lanes:      # most slots each lane may use
    p0: 240
    p1: 240
    p2: 96    # backfill: at most 40% of the slots
  lane_min: 12  # slots a waiting lane always gets, however busy the others are (5%)
  max_inflight_per_partition: 64
  yield_pages: 20
  yield_after: 60s
  timeline_page_size: 10
  comments_page_size: 50
  consecutive_old_stop: 3
  # Retries a task gets without its stream moving forward (a stream that
  # saves new pages between rate limits starts counting again), and in all.
  # Exhausted tasks go to the DLQ with reason max_attempts or
  # max_total_attempts.
  max_attempts: 5
  max_total_attempts: 50
  lease_ttl: 120s
  freshness_p0: 15m
  freshness_p1: 6h
  suppression_refresh: 60s

limits:            # defaults applied to jobs that do not override them
  max_age_days: 365
  max_age_cap_days: 1095
  max_posts: 0       # 0 = unlimited
  max_depth: 3
  include_comments: true
  include_replies: true
  include_media: true
  include_comment_media: true
  video_policy: sd   # none | thumbnail | sd | hd
  backfill_video_policy: thumbnail

scheduler:
  planner_interval: 30s
  planner_batch: 500
  default_interval: 3h
  jitter: 0.1
  finalizer_interval: 2s
  finalize_timeout: 10m
  reaper_after: 30m
  partition_months_ahead: 3
  incremental_overlap: 24h
  # Adaptive tiers for pages registered without schedule.interval_hours:
  # after each job the page's posting rate over rate_window picks the first
  # tier whose min_posts_per_day it reaches. No post for dormant_after puts
  # it on dormant_interval (T4). Every tier crawls for new posts every 3h:
  # a run that finds nothing new costs a request or two. The tiers still
  # choose which posts' comments are refreshed (post_refresh) and which
  # pages a budget slows down first.
  rate_window: 336h          # 14 days
  tiers:
    - {name: T0, min_posts_per_day: 10, interval: 3h}
    - {name: T1, min_posts_per_day: 1, interval: 3h}
    - {name: T2, min_posts_per_day: 0.142857, interval: 3h}    # weekly or more
    - {name: T3, min_posts_per_day: 0, interval: 3h}
  dormant_after: 2160h       # 90 days
  dormant_interval: 3h
  # Comments on posts older than incremental_overlap are refreshed on the
  # page's scheduled jobs (up to max_per_job posts each): a newest-first read
  # that stops at the first comment already stored, so an unchanged post
  # costs one request. Each refresh that finds nothing new doubles that
  # post's interval (up to 2^max_backoff). Busy posts get a full recrawl at
  # each recrawl_at age to pick up edits and deletions.
  post_refresh:
    enabled: true
    max_per_job: 50
    max_backoff: 3
    windows:
      - {max_age: 168h, interval: 24h}                   # up to 7 days old
      - {max_age: 336h, interval: 72h}                   # 7-14 days
      - {max_age: 720h, interval: 168h, tiers: [T0, T1]} # 14-30 days, active pages only
    recrawl_at: [168h, 720h]
    recrawl_min_comments: 20
    # Mark known top-level comments (and their replies) deleted when a full
    # read of their post no longer returns them. Only a complete read counts:
    # what it returned (comments plus their reply counts) must match the
    # post's comment count, within deletion_count_slack (a share; 0 = exact).
    detect_deletions: true
    deletion_count_slack: 0
  # Daily Facebook traffic budget, fleet-wide (0 = unlimited). Every interval
  # the leader projects the day's use from the last projection_span; when it
  # would exceed the budget, backfill (p2) pauses; if p0 + p1 alone would,
  # the stretch_tiers' intervals are multiplied by stretch. p0 is never held.
  # With a budget set, that is the one case where pages wait longer than 3h;
  # stretch_tiers: [] keeps them at 3h and lets the budget pause backfill only.
  budget:
    enabled: true
    requests_per_day: 0
    bytes_per_day: 0
    interval: 1m
    stretch: 2
    stretch_tiers: [T4, T3, T2]
    projection_span: 1h

# The shared content store (architecture §6). igs-content-writer reads the
# content.* topics into it; igsctl clickhouse migrate creates its tables.
clickhouse:
  addr: []                  # host:9000, ... (native protocol); empty: off
  database: securebrand
  username: default
  password: ""              # IGS_CLICKHOUSE__PASSWORD
  secure: false
  cluster: ""               # set to create Replicated tables ON CLUSTER
  storage_policy: ""        # with cold_after: old partitions move to its 'cold' volume
  cold_after: 0s
  batch_size: 5000
  linger: 1s

media:
  concurrency: 50
  # Media is kept until every required consumer (the analysis service)
  # acknowledged it (architecture: media until its analysis is complete).
  # A ttl > 0 deletes it after that long even without an acknowledgement.
  ttl: 0
  required_consumers: ["analysis"]
  max_retryable_failures: 3
  sweep_interval: 1h
  orphan_interval: 24h
  presign: false
  presign_ttl: 24h
  max_bytes: 524288000   # 500 MiB per object

api:
  max_running_p0_jobs_per_client: 50
  max_running_p0_jobs: 0       # on-demand jobs running fleet-wide; 0 = no cap
  default_rate_per_minute: 600

privacy:
  pii_mode: full        # full | pseudonymized
  author_hmac_key: "dev-only-change-me"
  download_author_avatars: false
  # igs keeps collected data forever (the owner, 2026-11-03): comments,
  # authors and post metrics are never dropped by age (0). Erasure requests
  # still delete a person's data. The job log, raw failure captures and
  # deleted media rows are operational and still expire.
  retention:
    comments_days: 0
    authors_inactive_days: 0
    metrics_days: 0
    raw_payload_days: 0   # raw responses are kept with the data (architecture §2.5)
    media_rows_days: 30
    jobs_days: 90

# fbs-registry-sync: every interval it loads the canary pages, scans them and
# their JS bundles for Relay doc_ids, records new ones as candidates, checks
# each candidate and the active entry with a real request on a canary page
# (timeline -> comments -> replies), and promotes a candidate that parses.
# The former active entry stays as a fallback.
registry_sync:
  interval: 30m
  canary_pages: []       # vanity names or URLs; set at least three in production
  tier: ""
  max_bundles: 60
  bundles_via_proxy: false
  promote: true
  keep_fallbacks: 2
  retire_after: 3
  recheck_retired: 24h
  timeout: 10m

# igs, the Instagram scraper (ADR 0005). Its binaries use the shared
# postgres (schema ig), redis, kafka (ig.* and igs.* topics) and s3 sections.
ig:
  base_url: "https://www.instagram.com"
  registry_seed: "ig/queries.seed.yaml"
  registry_refresh: 30s
  fingerprint_profile: chrome_152
  fingerprint_profiles: [chrome_152, chrome_146]
  accept_language: "en-US,en;q=0.9"
  request_timeout: 30s
  # 0.3 requests a second per identity, as the owner's probe ran; one exit
  # met Instagram's rate limit after 1,100 to 1,300 requests, so identities
  # retire after 500 to 750 and exits rest in turn.
  identity_rps: 0.33
  identity_burst: 2
  identity_max_requests_min: 500
  identity_max_requests_max: 750
  profile_rps: 3
  profile_rps_p0: 6
  global_rps: 50
  # Instagram limits per IP, so each proxy exit is paced fleet-wide, however
  # many identities and pods share it: the fleet reads at most
  # exits x exit_rps (10 exits: 2.5 requests a second). 0 = identity pacing
  # alone.
  exit_rps: 0.25
  # Rest an exit Instagram rate-limits, sends a checkpoint, or that sends
  # fresh page loads to the login page. After a rest one identity probes
  # it; a probe blocked again rests it twice as long, up to
  # proxy.breaker.max_cooldown.
  rate_limit_rest: 10m
  checkpoint_rest: 30m
  page_wall_rest: 30m
  # Page loads (profile and post pages) per static exit and UTC day,
  # fleet-wide; an exit that reaches it rests until the day ends (03:00
  # Iraq time). 0: no limit. Off until the pilot measures what an IP
  # tolerates (igs_exit_page_loads_total gives the counts).
  exit_page_loads_per_day: 0
  # A task whose identity is blocked moves to a fresh identity on another
  # exit and carries on, this many times a run, before it waits for a retry.
  block_hops: 2
  # A rest one crawler pod sees holds for every pod on the same exits: rests
  # are shared through Valkey and read every exit_rest_sync.
  share_exit_rests: true
  exit_rest_sync: 2s
  # A stopping crawler keeps its idle identities (cookies and tokens, never
  # proxy credentials) in Valkey this long; the next pod on the same exits
  # resumes them instead of loading a page per exit again. 0 = off.
  keep_identities: 1h
  # Every raw response is kept in the raw bucket (architecture §2.5), so a
  # parser fix or a new field can be applied to past data without
  # collecting again; each event carries its response's raw_ref.
  # failures keeps only the failed ones, none nothing.
  capture_raw: all         # all | failures | none
  proxy:
    tiers: []
    routing:
      default: [direct]
    breaker:
      window: 1m
      min_events: 20
      open_rate: 0.15
      cooldown: 2m
      max_cooldown: 30m
      probe_successes: 3
  query_breaker:
    window: 5m
    min_events: 20
    open_rate: 0.5
    cooldown: 2m
  aimd:
    enabled: true
    interval: 10s
    min_rps: 5
    max_rps: 500
    increase: 0.02
    decrease: 0.7
    low_block_rate: 0.02
    high_block_rate: 0.06
    min_samples: 100
    min_utilization: 0.8
  browser:
    enabled: false
    binary: ""
    max_concurrent: 2
    max_share: 0.02
    timeout: 45s
    no_sandbox: false
  detect:
    replace: false
  limits:
    max_age_days: 365
    max_age_cap_days: 365
    max_posts: 0                 # 0: every post in the age window
    max_comments_per_post: 0     # 0: every top-level comment
    include_comments: true
    include_media: false         # D5: metadata always, files once the analysis service exists
    include_reels: true          # the reels tab: each reel's views
    include_highlights: true
    video_policy: sd
  schedule:
    interval: 3h                 # D2: newest posts every 3 hours
    profile_refresh: 24h         # the profile itself daily
    jitter: 0.1
    post_refresh_window: 168h    # posts of the last 7 days: comments and counts refreshed
    post_refresh_per_run: 30
    # The reels tab, for each reel's views (owner, 6 Nov 2026): a scheduled
    # run reads it 7 days back; once a week per profile, back to
    # limits.max_age_days. 0: the whole age window on every run.
    reels_window: 168h
    reels_full_every: 168h
    # No profile is read more often than this (the hot tier, a custom interval).
    min_interval: 5m
    # Tiers (architecture §8). Hot is pinned (API, igsctl profiles tier,
    # client watchlists); profiles not pinned are warm at warm_posts_per_day
    # or more over auto_window, else long tail, checked every auto_every.
    # A run costs 5 to 10 requests: one exit (900 an hour) carries 15 to 30
    # hot profiles, 90 to 180 warm ones or 270 to 540 long-tail ones.
    tiers:
      hot: 10m
      warm: 1h
      long_tail: 3h
      auto: true
      warm_posts_per_day: 2
      auto_window: 336h
      auto_every: 24h
  # Daily traffic budget, fleet-wide (D9; 0 = none). Every interval the
  # leader scheduler projects the day's requests and wire bytes (page loads
  # and queries) from the last projection_span. When the day would exceed
  # the budget, backfill (p2) pauses; when on-demand and scheduled traffic
  # alone would, every scheduled run's interval is multiplied by stretch.
  # On-demand (p0) work is never held. Exit pacing (exit_rps) already bounds
  # the request rate; a byte budget suits a proxy plan billed per GB.
  budget:
    enabled: true
    requests_per_day: 0
    bytes_per_day: 0
    interval: 1m
    stretch: 2
    projection_span: 1h
  # Profile discovery (M11): the accounts met in the profiles igs reads
  # (tagged, co-authors, mentioned, commenters) are vetted with one profile
  # read each (the profile and its newest posts' captions, published
  # nowhere), scored for Iraqi signals (Iraq, its cities, +964 or .iq in the
  # name and bio; Arabic script, Sorani Kurdish, Iraqi dialect; sightings on
  # posts located in Iraq) and, when public and at threshold or above,
  # registered for the 3-hourly schedule. No cap on how many: exits bound
  # how fast. GET /v1/discovery/candidates lists them; reject removes one.
  discovery:
    enabled: false
    sources: [tags, coauthors, mentions, commenters]
    threshold: 4
    min_priority: 2
    vet_in_flight: 50
    interval: 30s
    revet_after: 720h
    min_followers: 0
    flush_every: 10s
    # Profiles registered per UTC day (03:00 Iraq time); 0 = no cap. Over
    # it, candidates wait as "capped", registered on the next days. No cap
    # in production (owner, 6 Nov 2026); tests, staging and a canary may
    # set one.
    max_new_per_day: 0
    # Discovery ranks below regular collection (owner, 6 Nov 2026): no new
    # vet while a scheduled profile is a full interval overdue or its run
    # still going a full interval after it started, or while more than
    # hold_resting_share of a static proxy tier's exits rest (0: never
    # held for rests). Running vets carry on.
    hold_when_behind: true
    hold_resting_share: 0.5
  privacy:
    pii_mode: full               # full | pseudonymized
    author_hmac_key: "dev-only-change-me-ig"
  registry_sync:
    interval: 30m
    canary_pages: []             # usernames of public profiles; set at least three in production
    tier: ""
    max_bundles: 60
    bundles_via_proxy: false
    promote: true
    keep_fallbacks: 2
    retire_after: 3
    recheck_retired: 24h
    timeout: 10m

