# igs's local stack, layered on docker-compose.yml's infrastructure
# (Postgres, Redpanda, Valkey, devs3) next to fakeig, a synthetic logged-out
# Instagram:
#   make igs-compose-up        build the image and start infrastructure + igs
#   make igs-compose-down
# The API answers on localhost:8081 (fbs's keeps 8080); create a key with
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/igs.yml exec igs-api igsctl apikey create --name dev
# and register fakeig's profiles (profile_01 .. profile_05) with
#   curl -H "Authorization: Bearer $KEY" -d '{"profile":"profile_01"}' localhost:8081/v1/profiles
# Never point it at real Instagram with these rates (igs-local.yaml).

x-igs: &igs
  image: ${IGS_IMAGE:-fbs:dev}
  restart: unless-stopped
  environment: &igs-env
    IGS_CONFIG: /etc/igs/local.yaml
    IGS_POSTGRES__DSN: postgres://fbs:fbs@postgres:5432/fbs?sslmode=disable
    IGS_REDIS__ADDR: valkey:6379
    IGS_KAFKA__BROKERS: redpanda:9092
    IGS_KAFKA__SCHEMA_REGISTRY__URL: http://redpanda:8081
    IGS_S3__ENDPOINT: s3:9000
    IGS_IG__BASE_URL: http://fakeig:8091
  volumes:
    - ./igs-local.yaml:/etc/igs/local.yaml:ro
  depends_on:
    igs-init: {condition: service_completed_successfully}
    igs-topics: {condition: service_completed_successfully}
    valkey: {condition: service_healthy}

services:
  fakeig:
    image: ${IGS_IMAGE:-fbs:dev}
    entrypoint: ["/usr/local/bin/fakeig", "--addr", ":8091", "--profiles", "5", "--posts", "30",
                 "--cdn-base", "http://fakeig:8091/fake-cdn"]
    ports: ["8091:8091"]

  igs-init:
    image: ${IGS_IMAGE:-fbs:dev}
    environment: *igs-env
    volumes:
      - ./igs-local.yaml:/etc/igs/local.yaml:ro
    entrypoint: ["/usr/local/bin/igsctl", "migrate", "up"]
    depends_on:
      postgres: {condition: service_healthy}

  igs-topics:
    image: ${IGS_IMAGE:-fbs:dev}
    environment: *igs-env
    volumes:
      - ./igs-local.yaml:/etc/igs/local.yaml:ro
    entrypoint: ["/usr/local/bin/igsctl", "kafka", "apply", "--partitions-cap", "3", "--replicas", "1"]
    depends_on:
      redpanda: {condition: service_healthy}

  igs-api:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-api"]
    ports: ["8081:8080"]

  igs-scheduler:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-scheduler"]

  igs-crawler:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-crawler", "--stages", "profile,post,retry"]

  igs-persister:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-persister"]

  igs-media:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-media", "--roles", "downloader,janitor"]

  igs-registry-sync:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-registry-sync"]
