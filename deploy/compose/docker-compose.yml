# igs's local stack: infrastructure (Postgres, Redpanda, Valkey, an
# in-memory S3), fakeig (a synthetic logged-out Instagram) and every igs
# service.
#   make compose-up        build the image and start everything
#   make compose-down
#   make infra-up          only the infrastructure, for the integration tests
# The API answers on localhost:8080; create a key with
#   docker compose -f deploy/compose/docker-compose.yml exec api igsctl apikey create --name dev
# and register fakeig's profiles (profile_01 .. profile_05) with
#   curl -H "Authorization: Bearer $KEY" -d '{"profile":"profile_01"}' localhost:8080/v1/profiles
# Never point it at real Instagram with these rates (local.yaml).
name: igs

x-igs: &igs
  image: ${IGS_IMAGE:-igs:dev}
  restart: unless-stopped
  environment: &igs-env
    IGS_CONFIG: /etc/igs/local.yaml
    IGS_POSTGRES__DSN: postgres://fbs:fbs@postgres:5432/fbs?sslmode=disable
    IGS_REDIS__ADDR: valkey:6379
    IGS_KAFKA__BROKERS: redpanda:9092
    IGS_KAFKA__SCHEMA_REGISTRY__URL: http://redpanda:8081
    IGS_S3__ENDPOINT: s3:9000
    IGS_IG__BASE_URL: ${IGS_IG_BASE_URL:-http://fakeig:8091}
  volumes:
    - ./local.yaml:/etc/igs/local.yaml:ro
  depends_on:
    init: {condition: service_completed_successfully}
    topics: {condition: service_completed_successfully}
    valkey: {condition: service_healthy}

services:
  postgres:
    image: postgres:18-alpine
    environment: {POSTGRES_USER: fbs, POSTGRES_PASSWORD: fbs, POSTGRES_DB: fbs}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "fbs"], interval: 2s, retries: 30}
    volumes: [pgdata:/var/lib/postgresql]

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: >
      redpanda start --mode dev-container --smp 1 --memory 1G
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    # 18081: Redpanda's Schema Registry (kafka.schema_registry.url).
    ports: ["19092:19092", "18081:8081"]
    healthcheck: {test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"], interval: 3s, retries: 30}

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, retries: 30}

  # In-memory S3 for development. Swap for MinIO/SeaweedFS/AWS S3 by changing
  # IGS_S3__ENDPOINT and credentials.
  s3:
    image: ${IGS_IMAGE:-igs:dev}
    entrypoint: ["/usr/local/bin/devs3", "--addr", ":9000"]
    ports: ["9000:9000"]

  fakeig:
    image: ${IGS_IMAGE:-igs:dev}
    entrypoint: ["/usr/local/bin/fakeig", "--addr", ":8091", "--profiles", "5", "--posts", "30",
                 "--cdn-base", "http://fakeig:8091/fake-cdn"]
    ports: ["8091:8091"]

  init:
    image: ${IGS_IMAGE:-igs:dev}
    environment: *igs-env
    volumes:
      - ./local.yaml:/etc/igs/local.yaml:ro
    entrypoint: ["/usr/local/bin/igsctl", "migrate", "up"]
    depends_on:
      postgres: {condition: service_healthy}

  topics:
    image: ${IGS_IMAGE:-igs:dev}
    environment: *igs-env
    volumes:
      - ./local.yaml:/etc/igs/local.yaml:ro
    entrypoint: ["/usr/local/bin/igsctl", "kafka", "apply", "--partitions-cap", "3", "--replicas", "1"]
    depends_on:
      redpanda: {condition: service_healthy}

  schemas:
    image: ${IGS_IMAGE:-igs:dev}
    environment: *igs-env
    volumes:
      - ./local.yaml:/etc/igs/local.yaml:ro
    entrypoint: ["/usr/local/bin/igsctl", "schemas", "apply"]
    depends_on:
      redpanda: {condition: service_healthy}

  api:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-api"]
    ports: ["8080:8080"]

  scheduler:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-scheduler"]

  crawler:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-crawler", "--stages", "profile,post,retry"]

  persister:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-persister"]

  media:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-media", "--roles", "downloader,janitor"]

  registry-sync:
    <<: *igs
    entrypoint: ["/usr/local/bin/igs-registry-sync"]

volumes:
  pgdata: {}
