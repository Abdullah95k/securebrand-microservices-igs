# igs's local overrides (mounted into every igs service). Fast pacing is
# fine against fakeig; NEVER use these rates against real Instagram.
service: {name: igs, env: dev}
log: {level: info, format: text}
media:
  required_consumers: ["analysis"]
ig:
  identity_rps: 20
  identity_burst: 5
  profile_rps: 50
  profile_rps_p0: 50
  global_rps: 200
  capture_raw: failures
  proxy:
    tiers: [{name: direct, kind: direct}]
    routing: {default: [direct]}
  limits:
    include_media: true
  registry_sync:
    interval: 5m
    canary_pages: [profile_01, profile_02, profile_03]   # fakeig profiles
