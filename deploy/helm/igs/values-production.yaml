# igs on the platform's production cluster (REQ-008 fix 11a). The platform
# installs it in the namespace igs:
#
#   helm upgrade --install igs deploy/helm/igs -n igs -f deploy/helm/igs/values-production.yaml
#
# It reads, in the namespace igs:
#   - Secret platform-credentials: Postgres, Kafka, Valkey, S3 and the
#     schema registry, under the platform's key names (values.yaml,
#     platformCredentials, lists them);
#   - Secret proxies, key proxies.yaml: the ISP exits, as a config layer
#     (ig.proxy.tiers, tier name isp; phase0/proxies.example.yaml shows
#     the shape);
#   - Secret igs-keys, key IGS_IG__PRIVACY__AUTHOR_HMAC_KEY: igs's own key
#     for the authors' HMAC, made once by the platform's setup (32 random
#     bytes as 64 hex characters) and never changed.
# Nothing here is a secret. Replace every <...> with the platform's value.

image:
  # The platform builds the image (Dockerfile, target runtime) and sets
  # these.
  repository: "<registry>/igs"
  tag: "<full commit SHA>"

platformCredentials:
  existingSecret: platform-credentials
secretFiles:
  existingSecret: proxies
  key: proxies.yaml
secretEnv:
  existingSecret: igs-keys

config:
  service: {name: igs, env: prod}
  log: {level: info, format: json}
  # The platform's Postgres is a transaction-mode PgBouncer with 50 server
  # connections for every service: a few connections per process, short
  # transactions (the pool queues the rest).
  postgres:
    max_conns: 4
  # The platform's Valkey has no VALKEY_DB key: by its convention igs uses
  # logical database 2.
  redis:
    db: 2
  s3:
    # The platform's shared buckets (S3_BUCKET_RAW, S3_BUCKET_MEDIA): igs
    # keeps to its prefixes and creates no bucket. Raw failures and a 1%
    # sample are kept for good under igs/keep/ (D-004); the other raw
    # responses go under igs/30d/, which the platform may expire after 30
    # days; media files under igs/.
    raw_keep_prefix: igs/keep/failures/
    raw_sample_prefix: igs/keep/sample/
    raw_prefix: igs/30d/
    media_prefix: igs/
    manage_buckets: false
  media:
    # Deleted once the analysis service acknowledged it, and at the latest
    # 72h after it was stored (the contract's default).
    ttl: 72h
    required_consumers: ["sb-analysis"]
  ig:
    # The platform's account requests (registry.account_request.v1): the
    # owner turned them on (10 Nov 2026).
    account_requests:
      enabled: true
    exit_rps: 0.25
    rate_limit_rest: 10m
    checkpoint_rest: 30m
    page_wall_rest: 30m
    block_hops: 2
    identity_rps: 0.33
    # Off until the pilot measures what an IP tolerates (owner, 6 Nov 2026).
    exit_page_loads_per_day: 0
    proxy:
      routing:
        default: [isp]
    privacy:
      pii_mode: full
    discovery:
      enabled: true
      threshold: 4
      # About 2 per exit (10 exits): vets wait for discovery's share of
      # each exit (exit_share), so more in flight only hold crawler slots
      # and identities without vetting faster.
      vet_in_flight: 20
      max_new_per_day: 0         # no cap in production (owner, 6 Nov 2026)
    registry_sync:
      # Three real public accounts: the platform sets them in its own
      # (private) Argo CD application, as config.ig.registry_sync.
      # canary_pages[0], [1] and [2]. Real accounts never go in this file.
      canary_pages: []
      # Each run takes its 3 canaries from the accounts igs has instead:
      # one with highlights first, then what the other queries need (owner,
      # 10 Nov 2026: "test on all the accounts you have"). The 3 above only
      # fill in when the store has too few. Still 3 page loads a run.
      store_canaries: 3
  crawler:
    # A task parks for 5 minutes at a time while every exit of its tier
    # rests, and each park counts toward max_total_attempts. 50 gave up
    # after about 4 hours: in the pilot, 53,239 post tasks reached the DLQ
    # waiting for exits at 0.1 rps (7-10 Nov). 300 waits about 25 hours.
    # Real failures stay bounded by max_attempts (5 stalls).
    max_total_attempts: 300

hooks:
  # The platform creates igs's topics (infra/production/kafka.tf) and
  # registers the shared subjects: igs creates no topic and registers no
  # schema. Migrations of igs's own schema still run.
  migrate: true
  topics: false
  schemas: false

keda:
  # The lag triggers read the brokers from the pods' KAFKA_BROKERS and log
  # in with the platform's Kafka user. The brokers' certificate is signed by
  # the platform's own CA (KAFKA_CA_CERT).
  bootstrapServersFromEnv: KAFKA_BROKERS
  authSecret: platform-credentials
  authKeys: {username: KAFKA_USER, password: KAFKA_PASSWORD, ca: KAFKA_CA_CERT}
  # KEDA's spelling of KAFKA_SASL_MECHANISM (SCRAM-SHA-256) and KAFKA_TLS.
  sasl: scram_sha256
  tls: enable

alerts:
  enabled: true
  labels: {release: prometheus}
dashboards:
  enabled: true
serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true
  # What igs's pods may reach (REQ-008 fix 21), as fbs's production sets it
  # (the master, 7 Nov 2026).
  egress:
    enabled: true
    dnsNamespace: kube-system
    services:
      # The VPC's private network: PgBouncer, Kafka and Valkey. Every port:
      # the managed services' private addresses and ports aren't fixed.
      - cidr: 10.30.0.0/16
      # The managed services' public endpoints, to be safe.
      - cidr: 0.0.0.0/0
        ports: [{port: 25060, endPort: 25080}]
    # Spaces (no private endpoint), the media CDN and the JavaScript
    # bundles registry-sync reads directly.
    https: [0.0.0.0/0]
    # The proxy gateway's per-IP ports, as fbs's provider has them. Check
    # them against PROXIES_IGS when it exists: a crawler that can't reach
    # its exits sees every request time out.
    proxies:
      - cidr: 0.0.0.0/0
        ports: [{port: 10000, endPort: 10999}]

# KEDA's maxima equal the partitions of the topics each consumes (the
# platform's sizes): more pods than partitions would only wait.
components:
  crawler-profile:
    autoscale: {min: 2, max: 6}
  crawler-post:
    autoscale: {min: 4, max: 12}
  persister:
    autoscale: {min: 2, max: 12}
  normalizer:
    autoscale: {min: 2, max: 12}
  media-downloader:
    autoscale: {min: 1, max: 3}
