{{- $root := . -}}
{{- range $name, $c := .Values.components }}
{{- if $c.enabled }}
{{- $pod := dict "root" $root "proxies" ($c.proxies | default "") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "igs.fullname" $root }}-{{ $name }}
  labels:
    {{- include "igs.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if $root.Values.paused }}
  replicas: 0
  {{- else if not (and $root.Values.keda.enabled $c.autoscale) }}
  replicas: {{ $c.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "igs.selector" (dict "root" $root "name" $name) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "igs.selector" (dict "root" $root "name" $name) | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml $root.Values.config | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        {{- with merge (deepCopy ($c.podAnnotations | default dict)) ($root.Values.podAnnotations | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- $browser := and $c.browser $root.Values.image.browserTag }}
      {{- $sidecar := and $browser $root.Values.browserContainer.enabled }}
      {{- if $browser }}
      # The pod's pause process becomes PID 1 and reaps Chromium's orphans.
      shareProcessNamespace: true
      {{- end }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: {{ $name }}
          {{- $tag := $root.Values.image.tag | default $root.Chart.AppVersion }}
          {{- if and $browser (not $sidecar) }}{{ $tag = $root.Values.image.browserTag }}{{ end }}
          image: "{{ $root.Values.image.repository }}:{{ $tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: {{- toYaml $c.command | nindent 12 }}
          env: {{- include "igs.env" $pod | nindent 12 }}
            {{- if $sidecar }}
            # Renders open a browser context in the chromium container.
            - name: IGS_IG__BROWSER__REMOTE
              value: "http://127.0.0.1:{{ $root.Values.browserContainer.port }}"
            {{- end }}
            {{- if and (eq $name "scheduler") $root.Values.fbCandidates.secretName }}
            # The Facebook collector's key (D-065), for the scheduler alone.
            - name: IGS_IG__FB_CANDIDATES__KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.fbCandidates.secretName }}
                  key: {{ required "fbCandidates.secretKey" $root.Values.fbCandidates.secretKey }}
            {{- end }}
          {{- include "igs.envFrom" (dict "root" $root "credentials" ($c.credentialsSecret | default "")) | nindent 10 }}
          ports:
            - {name: metrics, containerPort: 9090}
            {{- if $c.port }}
            - {name: http, containerPort: {{ $c.port }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml $c.resources | nindent 12 }}
          securityContext: {{- toYaml $root.Values.securityContext | nindent 12 }}
          volumeMounts: {{- include "igs.volumeMounts" $pod | nindent 12 }}
        {{- if $sidecar }}
        - name: chromium
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.browserTag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/usr/bin/chromium"]
          args:
            {{- toYaml $root.Values.browserContainer.args | nindent 12 }}
            - --remote-debugging-address=127.0.0.1
            - --remote-debugging-port={{ $root.Values.browserContainer.port }}
            # The crawler's DevTools client sends this Origin.
            - --remote-allow-origins=http://127.0.0.1
            - --user-data-dir=/tmp/chromium
            - about:blank
          readinessProbe:
            tcpSocket: {port: {{ $root.Values.browserContainer.port }}}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: {{ $root.Values.browserContainer.port }}}
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml $root.Values.browserContainer.resources | nindent 12 }}
          securityContext: {{- toYaml $root.Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: chromium-tmp
              mountPath: /tmp
        {{- end }}
      volumes: {{- include "igs.volumes" $pod | nindent 8 }}
        {{- if $sidecar }}
        - name: chromium-tmp
          emptyDir: {}
        {{- end }}
{{- if $c.pdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "igs.fullname" $root }}-{{ $name }}
  labels: {{- include "igs.labels" $root | nindent 4 }}
spec:
  {{- toYaml $c.pdb | nindent 2 }}
  selector:
    matchLabels: {{- include "igs.selector" (dict "root" $root "name" $name) | nindent 6 }}
{{- end }}
{{- if and $root.Values.keda.enabled $c.autoscale }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "igs.fullname" $root }}-{{ $name }}
  labels: {{- include "igs.labels" $root | nindent 4 }}
  {{- if $root.Values.paused }}
  annotations:
    autoscaling.keda.sh/paused-replicas: "0"
  {{- end }}
spec:
  scaleTargetRef:
    name: {{ include "igs.fullname" $root }}-{{ $name }}
  minReplicaCount: {{ $c.autoscale.min }}
  maxReplicaCount: {{ $c.autoscale.max }}
  pollingInterval: {{ $root.Values.keda.pollingInterval }}
  cooldownPeriod: {{ $root.Values.keda.cooldownPeriod }}
  triggers:
    {{- range $c.autoscale.lag }}
    - type: kafka
      metadata:
        {{- if $root.Values.keda.bootstrapServersFromEnv }}
        bootstrapServersFromEnv: {{ $root.Values.keda.bootstrapServersFromEnv | quote }}
        {{- else }}
        bootstrapServers: {{ $root.Values.keda.kafkaBootstrap | quote }}
        {{- end }}
        {{- with $root.Values.keda.sasl }}
        sasl: {{ . | quote }}
        {{- end }}
        {{- with $root.Values.keda.tls }}
        tls: {{ . | quote }}
        {{- end }}
        consumerGroup: {{ printf "%s%s" ($root.Values.config.kafka.topic_prefix | default "") .group | quote }}
        topic: {{ printf "%s%s" ($root.Values.config.kafka.topic_prefix | default "") .topic | quote }}
        lagThreshold: {{ .threshold | quote }}
        offsetResetPolicy: earliest
      {{- if $root.Values.keda.authSecret }}
      authenticationRef:
        name: {{ include "igs.fullname" $root }}-kafka
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
