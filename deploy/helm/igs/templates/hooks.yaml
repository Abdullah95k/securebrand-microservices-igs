{{- $root := . -}}
{{- $jobs := list -}}
{{- if .Values.hooks.migrate }}{{ $jobs = append $jobs (dict "name" "migrate" "args" (list "migrate" "up")) }}{{ end -}}
{{- $topicArgs := list "kafka" "apply" "--apply" "--replicas" (toString .Values.hooks.topicReplicas) -}}
{{- if .Values.hooks.topicPartitionsCap }}{{ $topicArgs = concat $topicArgs (list "--partitions-cap" (toString .Values.hooks.topicPartitionsCap)) }}{{ end -}}
{{- if .Values.hooks.topicsGrowPartitions }}{{ $topicArgs = append $topicArgs "--grow-partitions" }}{{ end -}}
{{- if .Values.hooks.topicsSetRetention }}{{ $topicArgs = append $topicArgs "--set-retention" }}{{ end -}}
{{- if .Values.hooks.topicsIncludeContent }}{{ $topicArgs = append $topicArgs "--include-content" }}{{ end -}}
{{- if .Values.hooks.topics }}{{ $jobs = append $jobs (dict "name" "topics" "args" $topicArgs) }}{{ end -}}
{{- $schemaArgs := list "schemas" "apply" -}}
{{- if .Values.hooks.schemasIncludeContent }}{{ $schemaArgs = append $schemaArgs "--include-content" }}{{ end -}}
{{- if .Values.hooks.schemas }}{{ $jobs = append $jobs (dict "name" "schemas" "args" $schemaArgs) }}{{ end -}}
{{- if and .Values.hooks.clickhouse (index .Values.components "content-writer" "enabled") }}{{ $jobs = append $jobs (dict "name" "clickhouse" "args" (list "clickhouse" "migrate")) }}{{ end -}}
{{- if .Values.paused }}{{ $jobs = list }}{{ end -}}
{{- $hook := dict "root" $root "proxies" "" }}
{{- range $jobs }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "igs.fullname" $root }}-{{ .name }}
  labels: {{- include "igs.labels" $root | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .name }}
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag | default $root.Chart.AppVersion }}"
          command: ["/usr/local/bin/igsctl"]
          args: {{- toYaml .args | nindent 12 }}
          env: {{- include "igs.env" $hook | nindent 12 }}
          {{- include "igs.envFrom" (dict "root" $root "credentials" "") | nindent 10 }}
          securityContext: {{- toYaml $root.Values.securityContext | nindent 12 }}
          {{- with $root.Values.hooks.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts: {{- include "igs.volumeMounts" $hook | nindent 12 }}
      volumes: {{- include "igs.hookVolumes" $root | nindent 8 }}
{{- end }}
