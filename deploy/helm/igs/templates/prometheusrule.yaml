{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "igs.fullname" . }}
  labels:
    {{- include "igs.labels" . | nindent 4 }}
    {{- with .Values.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- /* files/alerts.yaml holds Prometheus annotation templates, so it is included verbatim, not rendered. */}}
  {{- .Files.Get "files/alerts.yaml" | nindent 2 }}
{{- end }}
