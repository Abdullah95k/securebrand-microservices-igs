syntax = "proto3";

// The shared content contract (SecureBrand architecture §5 and §6): every
// collector's normalizer maps its platform events to these, and storage,
// analysis and alerts read only these. Fields are only ever added.
//
// It lives in igs until the shared schema repository exists; it is meant to
// move there unchanged (and to be reconciled with the analysis work's
// content.item.v1 first).
package securebrand.content.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/abdullah95k/securebrand-microservices-igs/gen/go/securebrand/content/v1;contentv1";

// Envelope is on every content event.
message Envelope {
  string event_id = 1;
  // facebook, instagram, tiktok, youtube, x, telegram.
  string platform = 2;
  // The entity's id on the platform, as text. Joins use a 64-bit hash of
  // (platform, native_id), computed where the rows are stored.
  string native_id = 3;
  // When the collector saw it, and when it was published (if it says).
  google.protobuf.Timestamp observed_at = 4;
  google.protobuf.Timestamp published_at = 5;
  // Grows with every observation: the newest version of an entity wins.
  int64 version = 6;
  string collector = 7;
  string collector_version = 8;
  // Where the raw response that carried it is kept (s3://bucket/key#line).
  string raw_ref = 9;
}

// Post: a post, video, reel, story, highlight item, community post or
// channel message (content.post).
message Post {
  Envelope envelope = 1;
  // The account that published it (its native id).
  string account_id = 2;
  // post | video | reel | story | highlight | community | message
  string kind = 3;
  string title = 4;
  string text = 5;
  string description = 6;
  // Empty from collectors: the analysis detects it.
  string language = 7;
  string url = 8;
  optional int64 views = 9;
  optional int64 likes = 10;
  optional int64 shares = 11;
  optional int64 comments = 12;
  int32 media_count = 13;
  // Platform-specific fields, as a JSON object.
  string extras_json = 14;
  bool is_deleted = 15;
  // Co-authors' account ids (Instagram collaborations).
  repeated string coauthor_ids = 16;
  // A post this one quotes or shares (X quote tweets), if any.
  string quoted_post_id = 17;
}

// Author is a comment's author as far as the collector may show it.
message Author {
  string author_id = 1;
  string name = 2;
  string profile_url = 3;
  string picture_url = 4;
  bool verified = 5;
  // A keyed hash of the author, stable across platforms' events, when the
  // collector pseudonymizes authors.
  bytes author_key = 6;
}

// Comment: a comment or a reply (content.comment). A comment always has a
// post; a reply also has its parent comment.
message Comment {
  Envelope envelope = 1;
  string post_id = 2;
  string parent_comment_id = 3;
  // The post's account.
  string account_id = 4;
  Author author = 5;
  string text = 6;
  string language = 7;
  optional int64 likes = 8;
  optional int64 replies = 9;
  string extras_json = 10;
  bool is_deleted = 11;
}

message Link {
  string url = 1;
  string title = 2;
}

// Account: a page, profile or channel (content.account), with what links
// it to the same brand or person elsewhere (bio, website, profile links).
message Account {
  Envelope envelope = 1;
  string handle = 2;
  string name = 3;
  // page | profile | channel | group
  string kind = 4;
  bool verified = 5;
  string category = 6;
  // Signals of the account's country (Iraq, for igs's discovery).
  repeated string country_signals = 7;
  string bio = 8;
  string website = 9;
  repeated Link links = 10;
  string picture_url = 11;
  optional int64 followers = 12;
  optional int64 following = 13;
  optional int64 post_count = 14;
  bool is_private = 15;
  bool is_business = 16;
  string extras_json = 17;
  bool is_deleted = 18;
}

// Metrics: one observation of an entity's counts (content.metrics), kept
// as a series (post_metrics, comment_metrics, account_snapshots).
message Metrics {
  Envelope envelope = 1;
  // post | comment | account
  string target = 2;
  // For a comment, its post; for a post, its account.
  string parent_id = 3;
  optional int64 views = 4;
  optional int64 likes = 5;
  optional int64 shares = 6;
  optional int64 comments = 7;
  optional int64 replies = 8;
  map<string, int64> reactions = 9;
  optional int64 followers = 10;
  optional int64 following = 11;
  optional int64 post_count = 12;
  // The platform hides the like count (it reads as a number that means
  // nothing).
  bool counts_hidden = 13;
}

// Media: an image or a video of a post, comment or account
// (content.media). Files are kept only until their analysis is complete.
message Media {
  Envelope envelope = 1;
  // post | comment | account
  string owner_type = 2;
  string owner_id = 3;
  // image | video
  string type = 4;
  string url = 5;
  google.protobuf.Timestamp url_expires_at = 6;
  int32 width = 7;
  int32 height = 8;
  int64 duration_ms = 9;
  string alt_text = 10;
  int32 position = 11;
}
