syntax = "proto3";

package securebrand.common.v1;

import "google/protobuf/timestamp.proto";
import "securebrand/common/v1/common.proto";

option go_package = "github.com/abdullah95k/securebrand-microservices-igs/gen/go/securebrand/common/v1;commonv1";

enum SubjectType {
  SUBJECT_TYPE_UNSPECIFIED = 0;
  // A person, by their author key (a commenter, or a profile's owner).
  SUBJECT_TYPE_AUTHOR = 1;
  // An account (an Instagram profile) and everything collected from it.
  SUBJECT_TYPE_ACCOUNT = 2;
}

// ErasureEvent is published on <platform>.erasure.v1. Every downstream
// consumer that stores scraped data must delete the subject's data when it
// receives one.
message ErasureEvent {
  string event_id = 1;
  Platform platform = 2;
  string request_id = 3;
  SubjectType subject_type = 4;
  bytes author_key = 5;
  int64 account_id = 6;
  google.protobuf.Timestamp requested_at = 7;
  google.protobuf.Timestamp completed_at = 8;
}
