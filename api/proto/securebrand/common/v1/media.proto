syntax = "proto3";

package securebrand.common.v1;

import "google/protobuf/timestamp.proto";
import "securebrand/common/v1/common.proto";

option go_package = "github.com/abdullah95k/securebrand-microservices-igs/gen/go/securebrand/common/v1;commonv1";

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_PHOTO = 1;
  MEDIA_KIND_VIDEO = 2;
  MEDIA_KIND_REEL = 3;
  MEDIA_KIND_THUMBNAIL = 4;
  MEDIA_KIND_COMMENT_PHOTO = 5;
  MEDIA_KIND_COMMENT_GIF = 6;
  MEDIA_KIND_STICKER = 7;
  MEDIA_KIND_COMMENT_VIDEO = 8;
  MEDIA_KIND_COVER = 9;
  MEDIA_KIND_PROFILE_PIC = 10;
  MEDIA_KIND_HIGHLIGHT = 11;
}

// MediaReady is published on <platform>.media.ready.v1 once the file is in
// object storage. The analysis service must answer with MediaProcessed.
message MediaReady {
  string event_id = 1;
  Platform platform = 2;
  string media_id = 3;
  // The platform's own id of the media (an Instagram media pk).
  string source_media_id = 4;
  MediaKind kind = 5;
  // original | sd | hd | thumbnail
  string variant = 6;
  // The account (Facebook page, Instagram user pk), post and comment it
  // belongs to.
  int64 account_id = 7;
  int64 post_id = 8;
  optional int64 comment_id = 9;
  S3Object object = 10;
  int32 width = 11;
  int32 height = 12;
  int64 duration_ms = 13;
  string alt_text = 14;
  google.protobuf.Timestamp discovered_at = 15;
  google.protobuf.Timestamp stored_at = 16;
  // The object is deleted at this time even without an ack.
  google.protobuf.Timestamp delete_after = 17;
  uint32 attempt = 18;
  // Set only when presigned URLs are enabled.
  string presigned_url = 19;
  repeated string job_ids = 20;
}

enum ProcessStatus {
  PROCESS_STATUS_UNSPECIFIED = 0;
  PROCESS_STATUS_PROCESSED = 1;
  PROCESS_STATUS_FAILED_PERMANENT = 2;
  PROCESS_STATUS_FAILED_RETRYABLE = 3;
}

// MediaProcessed is produced by the analysis service on
// <platform>.media.processed.v1.
message MediaProcessed {
  string event_id = 1;
  string media_id = 2;
  // Name of the consuming service; must match a configured required consumer.
  string consumer = 3;
  ProcessStatus status = 4;
  google.protobuf.Timestamp processed_at = 5;
  string error = 6;
}

enum DeleteReason {
  DELETE_REASON_UNSPECIFIED = 0;
  DELETE_REASON_ACKED = 1;
  DELETE_REASON_TTL_EXPIRED = 2;
  DELETE_REASON_ERASURE = 3;
  DELETE_REASON_ORPHAN = 4;
}

// MediaDeleted is published on <platform>.media.deleted.v1 after the object
// is gone.
message MediaDeleted {
  string event_id = 1;
  string media_id = 2;
  S3Object object = 3;
  DeleteReason reason = 4;
  google.protobuf.Timestamp deleted_at = 5;
  Platform platform = 6;
}
