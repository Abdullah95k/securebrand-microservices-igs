syntax = "proto3";

package securebrand.ig.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/abdullah95k/securebrand-microservices-igs/gen/go/securebrand/ig/v1;igv1";

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_COMPLETED = 1;
  // Finished, but part of the profile could not be read (a truncated grid,
  // a post whose comments stopped, failed tasks).
  JOB_STATUS_PARTIAL = 2;
  JOB_STATUS_FAILED = 3;
  JOB_STATUS_CANCELLED = 4;
}

// Completeness summarises how much of the profile a job read.
message Completeness {
  // Posts the job read (grid posts and refreshed ones).
  int64 posts = 1;
  int64 posts_complete = 2;
  int64 posts_truncated = 3;
  // Unchanged since the last read, or without comments.
  int64 posts_skipped = 4;
  // Gated: a login wall drawn in place of the post.
  int64 posts_gated = 5;
  // Instagram's comment counts of the posts read (top level and replies),
  // and the top-level comments stored for them.
  int64 comments_reported = 6;
  int64 comments_collected = 7;
}

// JobEvent is published on ig.job.v1 when a job reaches a terminal state.
// When it says COMPLETED or PARTIAL, all of the job's data is queryable.
message JobEvent {
  string event_id = 1;
  string job_id = 2;
  JobStatus status = 3;
  // on_demand | scheduled | backfill
  string kind = 4;
  string profile_ref = 5;
  int64 user_pk = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  map<string, int64> counters = 9;
  Completeness completeness = 10;
  repeated string errors = 11;
}
